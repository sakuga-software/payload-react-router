name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Payload 4 requires Node >= 24.15.
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the published file list
        run: pnpm pack --dry-run
      - name: Check that the demo is not published
        run: |
          if pnpm pack --dry-run 2>&1 | grep -q 'demo/'; then
            echo 'demo/ is in the package' && exit 1
          fi

  e2e:
    name: e2e on the demo (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # prod: `react-router build` + `react-router-serve`, what an app ships.
        # dev:  `vite dev`, which uses another module graph (HMR, dependency optimizer).
        mode: [prod, dev]
    env:
      CI: 'true'
      E2E_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The demo imports the adapter from dist/, so build the adapter first.
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter payload-react-router-demo exec playwright install --with-deps chromium
      - name: Build the demo
        if: matrix.mode == 'prod'
        run: pnpm --filter payload-react-router-demo build
      - name: Run the bench
        run: pnpm test:e2e
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.mode }}
          path: |
            demo/playwright-report
            demo/test-results
          retention-days: 14
